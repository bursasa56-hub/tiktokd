services:
  bot:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /data
      TELEGRAM_API_URL: http://telegram-bot-api:8081
    volumes:
      - bot_data:/data
    depends_on:
      - telegram-bot-api

  telegram-bot-api:
    image: aiogram/telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${API_ID}
      TELEGRAM_API_HASH: ${API_HASH}
      TELEGRAM_LOCAL: 1
    volumes:
      - tg_api_data:/var/lib/telegram-bot-api

volumes:
  bot_data:
  tg_api_data:
